name: Sync Personal Profile README

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台灣時間 08:00) 自動執行
  workflow_dispatch:     # 支援在 GitHub 網頁手動一鍵觸發
  push:
    branches:
      - main
    paths:
      - 'generate_readme.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch user repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo list opo2000tw --limit 100 --json name,description,isArchived,isFork,url,primaryLanguage > repos.json

      - name: Generate README.md
        run: |
          python3 generate_readme.py repos.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in profile README."
          else
            git commit -m "chore(auto): update profile README from repository changes"
            git push origin main
          fi
